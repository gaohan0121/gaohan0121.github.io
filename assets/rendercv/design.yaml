# for more options, see https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: classic
  page:
    size: a4
    top_margin: 0.5in
    bottom_margin: 0.5in
    left_margin: 0.55in
    right_margin: 0.55in
    show_footer: false
    show_top_note: false
  typography:
    line_spacing: 0.3em
    font_size:
      body: 9.2pt
      name: 26pt
      headline: 9.2pt
      connections: 9.2pt
      section_titles: 1.25em
  header:
    space_below_name: 0.35cm
    space_below_headline: 0.35cm
    space_below_connections: 0.35cm
    connections:
      space_between_connections: 0.3cm
  section_titles:
    space_above: 0.3cm
    space_below: 0.15cm
  sections:
    space_between_regular_entries: 0.65em
    space_between_text_based_entries: 0.2em
